name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1
        with:
          body: platinum
          output-dir: koi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wrap the koi in its card
        run: node scripts/koi-card.mjs
      - name: Commit the card if it changed
        shell: bash
        run: |
          git add assets/koi-card.svg assets/koi-card-mobile.svg
          if git diff --cached --quiet; then
            echo "The card is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: wrap the day's koi in its card"
          git pull --rebase --autostash --quiet
          git push --quiet
